[project]
name = "geo-news-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["geo-news-core", "apscheduler>=3.10", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
